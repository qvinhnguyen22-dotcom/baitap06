<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout-admin.html}">
<head>
    <title>Search Categories - HCMUTE</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold">
                            <i class="fa-solid fa-magnifying-glass me-2"></i>
                            Search Categories
                        </h5>
                        <a th:href="@{/admin/categories/add}" class="btn btn-sm btn-success">
                            <i class="fa-solid fa-plus-circle me-1"></i> Add New Category
                        </a>
                    </div>
                    <div class="card-body p-4">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <form th:action="@{/admin/categories/search}" method="get">
                                    <div class="input-group">
                                        <input type="text" class="form-control" name="name" placeholder="Search by category name..." />
                                        <button class="btn btn-primary" type="submit">Search</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div th:if="${#lists.isEmpty(categories)}" class="alert alert-warning text-center py-4">
                            <i class="fa-solid fa-box-open fs-2 mb-2 d-block text-warning"></i>
                            <h6>Không tìm thấy kết quả nào!</h6>
                        </div>

                        <div th:if="${!#lists.isEmpty(categories)}" class="table-responsive">
                            <table class="table table-hover table-striped align-middle border text-center">
                                <thead class="table-dark">
                                    <tr>
                                        <th style="width: 15%;">Category ID</th>
                                        <th class="text-start" style="width: 55%;">Category Name</th>
                                        <th style="width: 30%;">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="category : ${categories}">
                                        <td class="fw-bold text-secondary">#[[${category.categoryId}]]</td>
                                        <td class="text-start fw-medium text-dark">
                                            <i class="fa-regular fa-folder text-warning me-2"></i>
                                            <span th:text="${category.name}"></span>
                                        </td>
                                        <td>
                                            <div class="btn-group btn-group-sm">
                                                <a th:href="@{'/admin/categories/view/' + ${category.categoryId}}" class="btn btn-outline-info"><i class="fa-solid fa-circle-info"></i></a>
                                                <a th:href="@{'/admin/categories/edit/' + ${category.categoryId}}" class="btn btn-outline-warning"><i class="fa-solid fa-pen-to-square"></i></a>
                                                <a th:href="@{'/admin/categories/delete/' + ${category.categoryId}}"
                                                   onclick="return confirm('Bạn có chắc chắn muốn xóa?');"
                                                   class="btn btn-outline-danger"><i class="fa-solid fa-trash-can"></i></a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
