# Chạy ứng dụng trên port 8088 (theo slide bài giảng)
server.port=8088

# Tắt tính năng cache của Thymeleaf để cập nhật giao diện nhanh khi sửa code
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Cấu hình đa ngôn ngữ (i18n)
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.mvc.locale=vi_VN

# ==========================================
# CẤU HÌNH CƠ SỞ DỮ LIỆU MICROSOFT SQL SERVER
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=springboot_category;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1234567@a$
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA Properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

