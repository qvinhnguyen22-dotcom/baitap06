<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Category Management - HCMUTE</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1 0 auto;
        }
        .card {
            border-radius: 0.75rem;
            border: none;
            box-shadow: 0 0.125rem 0.5rem rgba(0, 0, 0, 0.08);
        }
        .card-header {
            border-top-left-radius: 0.75rem !important;
            border-top-right-radius: 0.75rem !important;
        }
        .btn {
            border-radius: 0.5rem;
        }
        .table > :not(caption) > * > * {
            padding: 0.85rem 0.75rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <!-- Header with student avatar and navbar -->
    <header>
        <div th:replace="~{admin/fragments/header :: header}"></div>
    </header>

    <!-- Main Container Content -->
    <main class="container my-4">
        <!-- Content fragment placeholder for children templates -->
        <div layout:fragment="content"></div>
    </main>

    <!-- Footer with student credentials -->
    <footer class="mt-auto">
        <div th:replace="~{admin/fragments/footer :: footer}"></div>
    </footer>

    <!-- Bootstrap 5 JS Bundle & jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom inline script blocks for child pages if needed -->
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
